name: Build

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ 'posts.json' ]   # app saves and publisher commits don't need a build
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # the default also asks for the removed 'tools' package

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publisher script tests
        run: python3 -m unittest discover -s scripts -v

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
